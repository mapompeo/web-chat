events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream chat_backend {
        # least_conn (nao round-robin puro): manda cada conexao nova pro
        # servidor que tem MENOS conexoes ativas agora. Pra conexao curta
        # (HTTP normal) round-robin ja e bom o suficiente, mas WebSocket fica
        # aberto por muito tempo (as vezes horas) - sem isso, quem desconecta
        # de um servidor nao "libera vaga" nenhuma pro rodizio, e o
        # desequilibrio so cresce com o tempo. Continua sem sticky session:
        # a escolha e por contagem de conexao, nao por quem e o cliente.
        least_conn;
        server backend1:8080;
        server backend2:8080;
        server backend3:8080;
    }

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        location /chatHub {
            proxy_pass http://chat_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # O navegador pede /favicon.ico sozinho, mesmo com o <link> do HTML
        # apontando pro SVG. Sem esta regra o pedido caia no try_files de
        # baixo e recebia o index.html com status 200: o navegador guardava
        # uma resposta "bem-sucedida" que nao e imagem nenhuma e seguia
        # exibindo o icone velho que tinha em cache. 404 e a resposta honesta
        # e faz ele usar o icone declarado no HTML.
        # O index.html nao pode ser guardado em cache: ele e o unico arquivo com
        # nome fixo, e e ele que aponta pros bundles com hash no nome. Sem esta
        # regra, depois de publicar uma versao nova o navegador continua abrindo
        # o index antigo, que pede bundles que nao existem mais, e a pessoa fica
        # presa numa versao velha ate limpar o cache na mao. Aconteceu durante o
        # desenvolvimento: a pagina servia main-WSISBIWO.js enquanto o servidor
        # ja tinha main-P6EF3ZBN.js.
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Os demais arquivos do build levam hash no nome, entao mudam de nome a
        # cada versao e podem ser guardados por bastante tempo sem risco.
        location ~* \.(js|css|svg|woff2?)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /favicon.ico {
            return 404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
